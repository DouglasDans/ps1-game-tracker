<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PS1 Game Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0d0d1a;
            color: #c8c8d8;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            padding: 2rem;
            min-height: 100vh;
        }

        h1 {
            color: #003791;
            font-size: 1.6rem;
            letter-spacing: 0.05em;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            color: #555577;
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }

        .active-session {
            background: #12122a;
            border-left: 4px solid #003791;
            padding: 1rem 1.2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .active-session .dot {
            width: 10px;
            height: 10px;
            background: #00c8ff;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .active-session .game-name {
            color: #e8e8ff;
            font-size: 1.05rem;
        }

        .active-session .meta {
            color: #555577;
            font-size: 0.8rem;
            margin-top: 0.2rem;
        }

        h2 {
            color: #003791;
            font-size: 1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            color: #003791;
            padding: 0.5rem 0.8rem;
            border-bottom: 1px solid #1a1a3a;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        td {
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid #111128;
            color: #b0b0c8;
        }

        tr:hover td {
            background: #12122a;
            color: #e8e8ff;
        }

        .no-data {
            color: #333355;
            padding: 2rem 0;
            text-align: center;
        }

        .timer {
            color: #00c8ff;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <h1>PS1 GAME TRACKER</h1>
    <p class="subtitle">Raspberry Pi 5 · PS1 Pro</p>

    <div id="active-container"></div>

    <h2>Biblioteca</h2>
    <table>
        <thead>
            <tr>
                <th>Jogo</th>
                <th>Plataforma</th>
                <th>Tempo total</th>
                <th>Sessões</th>
                <th>Último acesso</th>
            </tr>
        </thead>
        <tbody id="games-body">
            <tr><td colspan="5" class="no-data">Carregando...</td></tr>
        </tbody>
    </table>

    <script>
        function fmtTime(secs) {
            if (!secs) return "—";
            const h = Math.floor(secs / 3600);
            const m = Math.floor((secs % 3600) / 60);
            if (h > 0) return `${h}h ${m}m`;
            if (m > 0) return `${m}m`;
            return `${secs}s`;
        }

        function fmtDate(iso) {
            if (!iso) return "—";
            return new Date(iso + (iso.includes("Z") ? "" : "Z"))
                .toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
        }

        function fmtSource(src) {
            const map = { duckstation: "DuckStation", ppsspp: "PPSSPP", retroarch: "RetroArch", samba: "PS2/OPL" };
            return map[src] || src;
        }

        let sessionStart = null;

        function renderActive(session) {
            const el = document.getElementById("active-container");
            if (!session || !session.display_name) {
                el.innerHTML = "";
                sessionStart = null;
                return;
            }
            if (!sessionStart) sessionStart = Date.now();
            const elapsed = Math.floor((Date.now() - sessionStart) / 1000);
            el.innerHTML = `
                <div class="active-session">
                    <div class="dot"></div>
                    <div>
                        <div class="game-name">${session.display_name}</div>
                        <div class="meta">${fmtSource(session.source)} · sessão atual: <span class="timer">${fmtTime(elapsed)}</span></div>
                    </div>
                </div>`;
        }

        function renderGames(games) {
            const tbody = document.getElementById("games-body");
            if (!games || games.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="no-data">Nenhuma sessão registrada ainda.</td></tr>`;
                return;
            }
            tbody.innerHTML = games.map(g => `
                <tr>
                    <td>${g.display_name || g.file_path}</td>
                    <td>${g.platform || "—"}</td>
                    <td>${fmtTime(g.total_seconds)}</td>
                    <td>${g.session_count}</td>
                    <td>${fmtDate(g.last_played)}</td>
                </tr>`).join("");
        }

        async function refresh() {
            try {
                const [active, games] = await Promise.all([
                    fetch("/sessions/active").then(r => r.json()),
                    fetch("/games").then(r => r.json()),
                ]);
                renderActive(active);
                renderGames(games);
            } catch (e) {
                console.error("Refresh failed:", e);
            }
        }

        refresh();
        setInterval(refresh, 5000);
    </script>
</body>
</html>
